<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta

        name="viewport"

        content="width=device-width, initial-scale=1.0"

    >

    <title>

        Family Wealth AI OS V7

        Income Module Test

    </title>

    <style>

        body{

            font-family:

                Arial,

                sans-serif;

            margin:40px;

            background:#f5f5f5;

            color:#222;

        }

        .container{

            max-width:900px;

            margin:auto;

            background:white;

            padding:30px;

            border-radius:12px;

            box-shadow:

                0 2px 10px

                rgba(0,0,0,.1);

        }

        h1{

            margin-top:0;

        }

        .status{

            padding:15px;

            background:#eee;

            border-radius:8px;

            margin-bottom:20px;

        }

        .pass{

            color:green;

            font-weight:bold;

        }

        .fail{

            color:red;

            font-weight:bold;

        }

        pre{

            background:#111;

            color:#0f0;

            padding:15px;

            border-radius:8px;

            overflow:auto;

        }

    </style>

</head>

<body>

<div class="container">

    <h1>

        🏠 Family Wealth AI OS V7

    </h1>

    <h2>

        Income Module Integration Test

    </h2>

    <div

        id="status"

        class="status"

    >

        Testing Income Module...

    </div>

    <pre

        id="output"

    ></pre>

</div>

<script type="module">

    import IncomeModule

        from "./incomeModule.js";

    const output =

        document.getElementById(

            "output"

        );

    const status =

        document.getElementById(

            "status"

        );

    function log(message){

        output.textContent +=

            message + "\n";

    }

    function assert(

        condition,

        message

    ){

        if(!condition){

            throw new Error(

                "❌ FAIL: " +

                message

            );

        }

        log(

            "✅ PASS: " +

            message

        );

    }

    try{

        log(

            "=========================================="

        );

        log(

            "Family Wealth AI OS V7"

        );

        log(

            "Income Module Integration Test"

        );

        log(

            "=========================================="

        );

        // ==========================================

        // Module

        // ==========================================

        assert(

            IncomeModule,

            "Income Module loaded"

        );

        // ==========================================

        // Module Information

        // ==========================================

        assert(

            IncomeModule.name ===

                "Income Module V7",

            "Module name"

        );

        assert(

            IncomeModule.version ===

                "7.0",

            "Module version"

        );

        assert(

            IncomeModule.status ===

                "READY",

            "Module status"

        );

        // ==========================================

        // Components

        // ==========================================

        assert(

            IncomeModule.schema,

            "Schema loaded"

        );

        assert(

            IncomeModule.repository,

            "Repository loaded"

        );

        assert(

            IncomeModule.service,

            "Service loaded"

        );

        assert(

            IncomeModule.api,

            "API loaded"

        );

        assert(

            IncomeModule.agent,

            "Agent loaded"

        );

        assert(

            IncomeModule.ai,

            "AI loaded"

        );

        assert(

            IncomeModule.analysis,

            "Analysis Engine loaded"

        );

        assert(

            IncomeModule.events,

            "Events loaded"

        );

        assert(

            IncomeModule.view,

            "View loaded"

        );

        // ==========================================

        // Agent

        // ==========================================

        const agentInit =

            IncomeModule.agent.init();

        assert(

            agentInit &&

            agentInit.status ===

                "Income Agent Ready",

            "Agent initialize"

        );

        // ==========================================

        // Read

        // ==========================================

        const before =

            IncomeModule.agent

                .getIncome();

        assert(

            Array.isArray(before),

            "Read income"

        );

        // ==========================================

        // Create

        // ==========================================

        const testIncome = {

            source:

                "V7 Module Test",

            name:

                "V7 Module Test",

            amount:

                1000,

            value:

                1000,

            type:

                "Other"

        };

        const created =

            IncomeModule.agent

                .addIncome(

                    testIncome

                );

        assert(

            created,

            "Create income"

        );

        assert(

            created.id,

            "Income ID generated"

        );

        // ==========================================

        // Read Created

        // ==========================================

        const afterCreate =

            IncomeModule.agent

                .getIncome();

        const createdIncome =

            afterCreate.find(

                item =>

                    item.id ===

                    created.id

            );

        assert(

            createdIncome,

            "Read created income"

        );

        // ==========================================

        // Update

        // ==========================================

        const updated =

            IncomeModule.agent

                .updateIncome(

                    created.id,

                    {

                        source:

                            "V7 Module Test Updated",

                        name:

                            "V7 Module Test Updated",

                        amount:

                            2500,

                        value:

                            2500,

                        type:

                            "Business"

                    }

                );

        assert(

            updated,

            "Update income"

        );

        // ==========================================

        // Verify Update

        // ==========================================

        const afterUpdate =

            IncomeModule.agent

                .getIncome();

        const updatedIncome =

            afterUpdate.find(

                item =>

                    item.id ===

                    created.id

            );

        assert(

            updatedIncome,

            "Read updated income"

        );

        assert(

            Number(

                updatedIncome.amount ??

                updatedIncome.value ??

                0

            ) === 2500,

            "Updated amount = 2500"

        );

        // ==========================================

        // Summary

        // ==========================================

        const summary =

            IncomeModule.agent

                .getIncomeSummary();

        assert(

            summary !== null &&

            summary !== undefined,

            "Income summary"

        );

        // ==========================================

        // Analysis

        // ==========================================

        const analysis =

            IncomeModule.agent

                .analyze();

        assert(

            analysis &&

            analysis.type ===

                "INCOME_ANALYSIS",

            "Income analysis"

        );

        // ==========================================

        // Delete

        // ==========================================

        IncomeModule.agent

            .deleteIncome(

                created.id

            );

        // ==========================================

        // Verify Delete

        // ==========================================

        const afterDelete =

            IncomeModule.agent

                .getIncome();

        const deletedIncome =

            afterDelete.find(

                item =>

                    item.id ===

                    created.id

            );

        assert(

            !deletedIncome,

            "Delete income"

        );

        // ==========================================

        // Success

        // ==========================================

        log(

            "=========================================="

        );

        log(

            "🎉 INCOME MODULE V7"

        );

        log(

            "INTEGRATION TEST PASSED"

        );

        log(

            "=========================================="

        );

        status.innerHTML =

            '<span class="pass">' +

            '🎉 INCOME MODULE V7 ' +

            'INTEGRATION TEST PASSED' +

            '</span>';

    }

    catch(error){

        console.error(error);

        log("");

        log(

            "=========================================="

        );

        log(

            "❌ INCOME MODULE TEST FAILED"

        );

        log(

            "=========================================="

        );

        log(

            error.message

        );

        status.innerHTML =

            '<span class="fail">' +

            '❌ INCOME MODULE TEST FAILED' +

            '</span>';

    }

</script>

</body>

</html>
