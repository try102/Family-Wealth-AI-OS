<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta

    name="viewport"

    content="width=device-width, initial-scale=1.0"

>

<title>

Income Repository Test

</title>

</head>

<body>

<h1>

🏠 Family Wealth AI OS V7

</h1>

<h2>

Income Repository Test

</h2>

<div id="result">

Testing...

</div>

<script type="module">

import IncomeRepository

    from "./incomeRepository.js";

const result =

    document.getElementById(

        "result"

    );

function assert(

    condition,

    message

){

    if(!condition){

        throw new Error(

            message

        );

    }

}

try {

    // ======================================

    // Clear

    // ======================================

    IncomeRepository.clear();

    const before =

        IncomeRepository.findAll();

    assert(

        Array.isArray(before),

        "Find all incomes"

    );

    assert(

        before.length === 0,

        "Repository initially empty"

    );

    // ======================================

    // Create

    // ======================================

    const created =

        IncomeRepository.save({

            id:

                "repository-test-html-001",

            source:

                "V7 Repository Test",

            name:

                "V7 Repository Test",

            amount:

                1000,

            value:

                1000,

            type:

                "Other"

        });

    assert(

        created &&

        created.id,

        "Save income"

    );

    // ======================================

    // Read

    // ======================================

    const found =

        IncomeRepository.findById(

            created.id

        );

    assert(

        found &&

        found.id === created.id,

        "Read income"

    );

    // ======================================

    // Update

    // ======================================

    const updated =

        IncomeRepository.update(

            created.id,

            {

                source:

                    "V7 Repository Updated",

                name:

                    "V7 Repository Updated",

                amount:

                    2500,

                value:

                    2500,

                type:

                    "Business"

            }

        );

    assert(

        updated &&

        Number(

            updated.amount ??

            updated.value ??

            0

        ) === 2500,

        "Update income"

    );

    // ======================================

    // Verify

    // ======================================

    const afterUpdate =

        IncomeRepository.findById(

            created.id

        );

    assert(

        afterUpdate &&

        afterUpdate.name ===

            "V7 Repository Updated",

        "Verify update"

    );

    // ======================================

    // Delete

    // ======================================

    const deleted =

        IncomeRepository.remove(

            created.id

        );

    assert(

        deleted === true,

        "Delete income"

    );

    // ======================================

    // Verify Delete

    // ======================================

    const deletedIncome =

        IncomeRepository.findById(

            created.id

        );

    assert(

        deletedIncome === null,

        "Verify delete"

    );

    // ======================================

    // Final Clear

    // ======================================

    IncomeRepository.clear();

    result.innerHTML = `

        <h2 style="color:green;">

            🎉 INCOME REPOSITORY TEST PASSED

        </h2>

        <p>

            Create: ✅ PASS

        </p>

        <p>

            Read: ✅ PASS

        </p>

        <p>

            Update: ✅ PASS

        </p>

        <p>

            Delete: ✅ PASS

        </p>

        <p>

            Clear: ✅ PASS

        </p>

    `;

}

catch(error){

    result.innerHTML = `

        <h2 style="color:red;">

            ❌ INCOME REPOSITORY TEST FAILED

        </h2>

        <pre>

${

    error.stack ||

    error.message ||

    String(error)

}

        </pre>

    `;

}

</script>

</body>

</html>
