<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta

        name="viewport"

        content="width=device-width, initial-scale=1.0"

    >

    <title>

        Liability Module Load Test

    </title>

    <style>

        body{

            font-family:

                Arial,

                sans-serif;

            margin:40px;

            background:#f5f5f5;

        }

        .container{

            max-width:900px;

            margin:auto;

            background:white;

            padding:30px;

            border-radius:12px;

            box-shadow:

                0 2px 10px

                rgba(0,0,0,.1);

        }

        pre{

            background:#111;

            color:#0f0;

            padding:20px;

            border-radius:8px;

            white-space:pre-wrap;

            word-break:break-word;

        }

        .success{

            color:green;

            font-weight:bold;

        }

        .error{

            color:red;

            font-weight:bold;

        }

    </style>

</head>

<body>

<div class="container">

    <h1>

        🏠 Family Wealth AI OS V7

    </h1>

    <h2>

        Liability Module Load Test

    </h2>

    <div id="status">

        Testing...

    </div>

    <pre id="output"></pre>

</div>

<script type="module">

const output =

    document.getElementById(

        "output"

    );

const status =

    document.getElementById(

        "status"

    );

function log(message){

    output.textContent +=

        message + "\n";

}

async function test(){

    try{

        log(

            "=========================================="

        );

        log(

            "Family Wealth AI OS V7"

        );

        log(

            "Liability Module Load Test"

        );

        log(

            "=========================================="

        );

        log(

            ""

        );

        log(

            "Loading:"

        );

        log(

            "./core/modules/liabilityModule.js"

        );

        const module =

            await import(

                "../core/modules/liabilityModule.js"

            );

        log(

            ""

        );

        log(

            "✅ liabilityModule.js loaded"

        );

        const LiabilityModule =

            module.default;

        if(

            !LiabilityModule

        ){

            throw new Error(

                "liabilityModule.js has no default export"

            );

        }

        log(

            "✅ Default export found"

        );

        log(

            ""

        );

        log(

            "Module Name:"

        );

        log(

            String(

                LiabilityModule.name

            )

        );

        log(

            ""

        );

        log(

            "Module Version:"

        );

        log(

            String(

                LiabilityModule.version

            )

        );

        log(

            ""

        );

        log(

            "Module Status:"

        );

        log(

            String(

                LiabilityModule.status

            )

        );

        log(

            ""

        );

        log(

            "Checking API..."

        );

        if(

            !LiabilityModule.api

        ){

            throw new Error(

                "LiabilityModule.api not found"

            );

        }

        log(

            "✅ API loaded"

        );

        log(

            ""

        );

        log(

            "Checking Agent..."

        );

        if(

            !LiabilityModule.agent

        ){

            throw new Error(

                "LiabilityModule.agent not found"

            );

        }

        log(

            "✅ Agent loaded"

        );

        log(

            ""

        );

        log(

            "Checking AI..."

        );

        if(

            !LiabilityModule.ai

        ){

            throw new Error(

                "LiabilityModule.ai not found"

            );

        }

        log(

            "✅ AI loaded"

        );

        log(

            ""

        );

        log(

            "Checking View..."

        );

        if(

            !LiabilityModule.view

        ){

            throw new Error(

                "LiabilityModule.view not found"

            );

        }

        log(

            "✅ View loaded"

        );

        log(

            ""

        );

        log(

            "Checking View.render..."

        );

        if(

            typeof

            LiabilityModule.view.render

            !==

            "function"

        ){

            throw new Error(

                "LiabilityModule.view.render is not a function"

            );

        }

        log(

            "✅ View.render exists"

        );

        log(

            ""

        );

        log(

            "=========================================="

        );

        log(

            "🎉 LIABILITY MODULE LOAD PASSED"

        );

        log(

            "=========================================="

        );

        status.innerHTML =

            `

            <p class="success">

                🎉 Liability Module Loaded Successfully

            </p>

            `;

    }

    catch(error){

        console.error(

            error

        );

        log(

            ""

        );

        log(

            "=========================================="

        );

        log(

            "❌ LIABILITY MODULE LOAD FAILED"

        );

        log(

            "=========================================="

        );

        log(

            ""

        );

        log(

            "ERROR MESSAGE:"

        );

        log(

            error?.message ||

            String(error)

        );

        log(

            ""

        );

        log(

            "ERROR STACK:"

        );

        log(

            error?.stack ||

            "No stack available"

        );

        status.innerHTML =

            `

            <p class="error">

                ❌ Liability Module Load Failed

            </p>

            `;

    }

}

test();

</script>

</body>

</html>
