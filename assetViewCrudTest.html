<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width, initial-scale=1.0">

<title>

Family Wealth AI OS V7

AssetView CRUD Diagnostic

</title>

</head>

<body>

<div id="app">

Loading...

</div>

<script type="module">

const app =

document.getElementById("app");

let step = "START";

function showError(error){

    app.innerHTML = `

        <h1>

            Family Wealth AI OS V7

        </h1>

        <h2 style="color:red">

            ❌ AssetView CRUD Test Error

        </h2>

        <p>

            <strong>

                Failed Step:

            </strong>

            ${step}

        </p>

        <pre style="

            white-space:pre-wrap;

            word-break:break-word;

            color:red;

        ">${error?.stack ||

           error?.message ||

           String(error)}</pre>

    `;

}

try {

    // ==========================================

    // STEP 1

    // ==========================================

    step =

        "Loading AssetsModule";

    const module =

    await import(

        "./core/modules/assetsModule.js?v=20260809-crud03"

    );
    const AssetsModule =

        module.default;

    if(!AssetsModule){

        throw new Error(

            "AssetsModule is undefined"

        );

    }

    // ==========================================

    // STEP 2

    // ==========================================

    step =

        "Loading AssetView";

    const AssetView =

        AssetsModule.view;

    const AssetAPI =

        AssetsModule.api;

    if(!AssetView){

        throw new Error(

            "AssetsModule.view is undefined"

        );

    }

    if(!AssetAPI){

        throw new Error(

            "AssetsModule.api is undefined"

        );

    }

    // ==========================================

    // STEP 3

    // ==========================================

    step =

        "Creating test container";

    const container =

        document.createElement("div");

    document.body.appendChild(

        container

    );

    // ==========================================

    // STEP 4

    // ==========================================

    step =

        "Cleaning previous CRUD test data";

    AssetAPI

        .getAll()

        .filter(

            asset =>

                asset.name ===

                "V7 CRUD Test Asset" ||

                asset.name ===

                "V7 CRUD Test Asset Updated"

        )

        .forEach(

            asset => {

                AssetAPI.remove(

                    asset.id

                );

            }

        );

    // ==========================================

    // STEP 5

    // ==========================================

    step =

        "Creating test asset";

    const created =

        AssetAPI.create({

            name:

            "V7 CRUD Test Asset",

            category:

            "Cash",

            currentValue:

            10000,

            liquidity:

            "High"

        });

    if(!created){

        throw new Error(

            "AssetAPI.create() returned empty result"

        );

    }

    // ==========================================

    // STEP 6

    // ==========================================

    step =

        "Reading created asset";

    let assets =

        AssetAPI.getAll();

    let testAsset =

        assets.find(

            asset =>

                asset.name ===

                "V7 CRUD Test Asset"

        );

    if(!testAsset){

        throw new Error(

            "Created test asset was not found"

        );

    }

    // ==========================================

    // STEP 7

    // ==========================================

    step =

        "Rendering AssetView";

    AssetView.render(

        container

    );

    // ==========================================

    // STEP 8

    // ==========================================

    step =

        "Finding Edit button";

    const editButton =

        container.querySelector(

            ".edit-asset-button"

        );

    if(!editButton){

        throw new Error(

            "Edit button not found"

        );

    }

    // ==========================================

    // STEP 9

    // ==========================================

    step =

        "Opening Edit form";

    editButton.click();

    const editForm =

        container.querySelector(

            "#asset-edit-form"

        );

    if(!editForm){

        throw new Error(

            "Edit form not found after clicking Edit"

        );

    }

    // ==========================================

    // STEP 10

    // ==========================================

    step =

        "Finding Edit value field";

    const valueField =

        editForm.querySelector(

            "#edit-asset-value"

        );

    const nameField =

        editForm.querySelector(

            "#edit-asset-name"

        );

    if(!valueField){

        throw new Error(

            "#edit-asset-value not found"

        );

    }

    if(!nameField){

        throw new Error(

            "#edit-asset-name not found"

        );

    }

    // ==========================================

    // STEP 11

    // ==========================================

    step =

        "Updating test asset";

    valueField.value =

        "25000";

    nameField.value =

        "V7 CRUD Test Asset Updated";

    editForm.dispatchEvent(

        new Event(

            "submit",

            {

                bubbles:

                true,

                cancelable:

                true

            }

        )

    );

    // ==========================================

    // STEP 12

    // ==========================================

    step =

        "Verifying Edit";

    assets =

        AssetAPI.getAll();

    const editedAsset =

        assets.find(

            asset =>

                asset.id ===

                testAsset.id

        );

    if(!editedAsset){

        throw new Error(

            "Edited asset disappeared"

        );

    }

    const editPassed =

        editedAsset.name ===

        "V7 CRUD Test Asset Updated"

        &&

        Number(

            editedAsset.currentValue

        ) === 25000;

    if(!editPassed){

        throw new Error(

            "Edit verification failed: " +

            JSON.stringify(

                editedAsset,

                null,

                2

            )

        );

    }

    // ==========================================

    // STEP 13

    // ==========================================

    step =

        "Rendering edited AssetView";

    AssetView.render(

        container

    );

    // ==========================================

    // STEP 14

    // ==========================================

    step =

        "Finding Delete button";

    const deleteButton =

        container.querySelector(

            ".delete-asset-button"

        );

    if(!deleteButton){

        throw new Error(

            "Delete button not found"

        );

    }

    // ==========================================

    // STEP 15

    // ==========================================

    step =

        "Executing Delete";

    const originalConfirm =

        window.confirm;

    window.confirm =

        () => true;

    try {

        deleteButton.click();

    }

    finally {

        window.confirm =

            originalConfirm;

    }

    // ==========================================

    // STEP 16

    // ==========================================

    step =

        "Verifying Delete";

    assets =

        AssetAPI.getAll();

    const deletedAsset =

        assets.find(

            asset =>

                asset.id ===

                testAsset.id

        );

    if(deletedAsset){

        throw new Error(

            "Delete verification failed: asset still exists: " +

            JSON.stringify(

                deletedAsset,

                null,

                2

            )

        );

    }

    // ==========================================

    // STEP 17

    // ==========================================

    step =

        "Final cleanup";

    assets

        .filter(

            asset =>

                asset.name ===

                "V7 CRUD Test Asset"

                ||

                asset.name ===

                "V7 CRUD Test Asset Updated"

        )

        .forEach(

            asset => {

                AssetAPI.remove(

                    asset.id

                );

            }

        );

    // ==========================================

    // SUCCESS

    // ==========================================

    step =

        "COMPLETE";

    const remaining =

        AssetAPI.getAll();

    app.innerHTML = `

        <h1>

            Family Wealth AI OS V7

        </h1>

        <h2>

            AssetView CRUD Diagnostic

        </h2>

        <h2 style="color:green">

            ✅ ASSETVIEW CRUD PASSED

        </h2>

        <hr>

        <p>

            Create: ✅ PASS

        </p>

        <p>

            Read: ✅ PASS

        </p>

        <p>

            Edit: ✅ PASS

        </p>

        <p>

            Delete: ✅ PASS

        </p>

        <p>

            Cleanup: ✅ PASS

        </p>

        <h3>

            Edited Asset

        </h3>

        <pre>${JSON.stringify(

            editedAsset,

            null,

            2

        )}</pre>

        <h3>

            Remaining Assets

        </h3>

        <pre>${JSON.stringify(

            remaining,

            null,

            2

        )}</pre>

    `;

}

catch(error){

    showError(error);

}

</script>

</body>

</html>
