<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width, initial-scale=1.0">

<title>

Family Wealth AI OS V7

</title>

</head>

<body>

<div id="app">

Loading InvestmentAgent Test...

</div>

<script type="module">

const app =

document.getElementById("app");

try {

    const module =

        await import(

            "./modules/investment/agent/investmentAgent.js"

        );

    const InvestmentAgent =

        module.default;

    app.innerHTML = `

        <h1>

        InvestmentAgent Test

        </h1>

        <p style="color:green">

        ✅ InvestmentAgent

        Loaded Successfully

        </p>

        <p>

        Type:

        ${typeof InvestmentAgent}

        </p>

        <p>

        Name:

        ${InvestmentAgent.name || "N/A"}

        </p>

    `;

}

catch(error) {

    app.innerHTML = `

        <h1>

        InvestmentAgent Import Error

        </h1>

        <pre style="

            white-space:pre-wrap;

            word-break:break-word;

            color:red;

        ">${error.stack ||

           error.message ||

           String(error)}</pre>

    `;

}

</script>

</body>

</html>
