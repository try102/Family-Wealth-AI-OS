<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width, initial-scale=1.0">

<title>

Family Wealth AI OS V7

</title>

</head>

<body>

<div id="app">

Loading TaxFacade Test...

</div>

<script type="module">

const app =

document.getElementById("app");

try {

    const module =

        await import(

            "./tax/taxFacade.js"

        );

    const TaxFacade =

        module.default;

    const tax =

        new TaxFacade();

    app.innerHTML = `

        <h1>

        TaxFacade Test

        </h1>

        <p style="color:green">

        ✅ TaxFacade

        Loaded Successfully

        </p>

        <p>

        Type:

        ${typeof TaxFacade}

        </p>

        <p>

        Instance:

        ${typeof tax}

        </p>

        <p>

        Constructor:

        ${tax.constructor.name}

        </p>

    `;

}

catch(error) {

    app.innerHTML = `

        <h1>

        TaxFacade Import Error

        </h1>

        <pre style="

            white-space:pre-wrap;

            word-break:break-word;

            color:red;

        ">${error.stack ||

           error.message ||

           String(error)}</pre>

    `;

}

</script>

</body>

</html>
