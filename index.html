<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width, initial-scale=1.0">

<title>

Family Wealth AI OS V7

</title>

</head>

<body>

<div id="app">

Loading DataService Test...

</div>

<script type="module">

const app =

document.getElementById("app");

app.innerHTML = `

<h1>

Family Wealth AI OS V7

</h1>

<h2>

DataService Test

</h2>

<p>

Testing DataService...

</p>

`;

try {

    const module =

        await import(

            "./core/database/dataService.js"

        );

    const DataService =

        module.default;

    app.innerHTML = `

        <h1>

        DataService Test

        </h1>

        <p style="color:green">

        ✅ DataService

        Loaded Successfully

        </p>

        <p>

        Type:

        ${typeof DataService}

        </p>

        <p>

        save:

        ${typeof DataService.save}

        </p>

        <p>

        load:

        ${typeof DataService.load}

        </p>

        <p>

        remove:

        ${typeof DataService.remove}

        </p>

        <p>

        clear:

        ${typeof DataService.clear}

        </p>

    `;

}

catch(error) {

    app.innerHTML = `

        <h1>

        DataService Import Error

        </h1>

        <pre style="

            white-space:pre-wrap;

            word-break:break-word;

            color:red;

        ">${error.stack ||

           error.message ||

           String(error)}</pre>

    `;

}

</script>

</body>

</html>
