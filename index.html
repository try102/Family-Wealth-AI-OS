<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width, initial-scale=1.0">

<title>

Family Wealth AI OS V7

</title>

</head>

<body>

<div id="app">

Loading AgentRegistry Test...

</div>

<script type="module">

const app =

document.getElementById("app");

try {

    const module =

        await import(

            "./core/registry/agentRegistry.js"

        );

    const AgentRegistry =

        module.default;

    const list =

        AgentRegistry.list();

    app.innerHTML = `

        <h1>

        AgentRegistry Test

        </h1>

        <p style="color:green">

        ✅ AgentRegistry Loaded Successfully

        </p>

        <p>

        Type:

        ${typeof AgentRegistry}

        </p>

        <p>

        register:

        ${typeof AgentRegistry.register}

        </p>

        <p>

        list:

        ${typeof AgentRegistry.list}

        </p>

        <h3>

        Registered Agents

        </h3>

        <pre>${JSON.stringify(

            list,

            null,

            2

        )}</pre>

    `;

}

catch(error) {

    app.innerHTML = `

        <h1>

        AgentRegistry Import Error

        </h1>

        <pre style="

            white-space:pre-wrap;

            word-break:break-word;

            color:red;

        ">${error.stack ||

           error.message ||

           String(error)}</pre>

    `;

}

</script>

</body>

</html>
