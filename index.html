<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width, initial-scale=1.0">

<title>

Family Wealth AI OS V7

</title>

</head>

<body>

<div id="app">

Loading SystemManager Start Test...

</div>

<script type="module">

const app =

document.getElementById("app");

app.innerHTML = `

<h1>

Family Wealth AI OS V7

</h1>

<h2>

SystemManager Start Test

</h2>

<p>

Starting system...

</p>

`;

try {

    const module =

        await import(

            "./core/system/systemManager.js"

        );

    const SystemManager =

        module.default;

    const result =

        SystemManager.start();

    const status =

        SystemManager.status();

    app.innerHTML = `

        <h1>

        SystemManager Start Test

        </h1>

        <p style="color:green">

        ✅ System Started Successfully

        </p>

        <h3>

        Start Result

        </h3>

        <pre>${JSON.stringify(

            result,

            null,

            2

        )}</pre>

        <h3>

        System Status

        </h3>

        <pre>${JSON.stringify(

            status,

            null,

            2

        )}</pre>

    `;

}

catch(error) {

    app.innerHTML = `

        <h1>

        SystemManager Start Error

        </h1>

        <pre style="

            white-space:pre-wrap;

            word-break:break-word;

            color:red;

        ">${error.stack ||

           error.message ||

           String(error)}</pre>

    `;

}

</script>

</body>

</html>
