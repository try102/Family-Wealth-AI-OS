<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width, initial-scale=1.0">

<title>

Family Wealth AI OS V7

</title>

</head>

<body>

<div id="app">

Loading AssetRepository Test...

</div>

<script type="module">

const app =

document.getElementById("app");

app.innerHTML = `

<h1>

Family Wealth AI OS V7

</h1>

<h2>

AssetRepository Test

</h2>

<p>

Testing AssetRepository...

</p>

`;

try {

    const module =

        await import(

            "./modules/assets/repository/assetRepository.js"

        );

    const AssetRepository =

        module.default;

    app.innerHTML = `

        <h1>

        AssetRepository Test

        </h1>

        <p style="color:green">

        ✅ AssetRepository

        Loaded Successfully

        </p>

        <p>

        Type:

        ${typeof AssetRepository}

        </p>

        <p>

        findAll:

        ${typeof AssetRepository.findAll}

        </p>

        <p>

        findById:

        ${typeof AssetRepository.findById}

        </p>

        <p>

        save:

        ${typeof AssetRepository.save}

        </p>

        <p>

        delete:

        ${typeof AssetRepository.delete}

        </p>

    `;

}

catch(error) {

    app.innerHTML = `

        <h1>

        AssetRepository Import Error

        </h1>

        <pre style="

            white-space:pre-wrap;

            word-break:break-word;

            color:red;

        ">${error.stack ||

           error.message ||

           String(error)}</pre>

    `;

}

</script>

</body>

</html>
