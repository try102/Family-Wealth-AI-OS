<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width, initial-scale=1.0">

<title>

Family Wealth AI OS V7

</title>

</head>

<body>

<div id="app">

Loading Family Wealth AI OS V7...

</div>

<script type="module">

const app =

document.getElementById("app");

try {

    app.innerHTML = `

        <h1>

        Family Wealth AI OS V7

        </h1>

        <h2>

        Core System Overall Test

        </h2>

        <p>

        Starting complete system...

        </p>

    `;

    const module =

        await import(

            "./core/system/systemManager.js"

        );

    const SystemManager =

        module.default;

    const startResult =

        SystemManager.start();

    const status =

        SystemManager.status();

    app.innerHTML = `

        <h1>

        Family Wealth AI OS V7

        </h1>

        <h2>

        Core System Overall Test

        </h2>

        <p style="

            color:green;

            font-size:20px;

            font-weight:bold;

        ">

        ✅ FAMILY WEALTH AI OS V7

        CORE STARTED SUCCESSFULLY

        </p>

        <h3>

        Start Result

        </h3>

        <pre>${JSON.stringify(

            startResult,

            null,

            2

        )}</pre>

        <h3>

        System Status

        </h3>

        <pre>${JSON.stringify(

            status,

            null,

            2

        )}</pre>

    `;

}

catch(error) {

    app.innerHTML = `

        <h1>

        Family Wealth AI OS V7

        </h1>

        <h2>

        ❌ CORE SYSTEM START ERROR

        </h2>

        <pre style="

            white-space:pre-wrap;

            word-break:break-word;

            color:red;

        ">${error.stack ||

           error.message ||

           String(error)}</pre>

    `;

}

</script>

</body>

</html>
