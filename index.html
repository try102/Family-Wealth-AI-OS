<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width, initial-scale=1.0">

<title>

Family Wealth AI OS V7

</title>

</head>

<body>

<div id="app">

Loading SystemBootstrap Test...

</div>

<script type="module">

const app =

document.getElementById("app");

app.innerHTML = `

<h1>

Family Wealth AI OS V7

</h1>

<h2>

SystemBootstrap Test

</h2>

<p>

Testing SystemBootstrap...

</p>

`;

try {

    const module =

        await import(

            "./core/bootstrap/systemBootstrap.js"

        );

    const SystemBootstrap =

        module.default;

    const result =

        SystemBootstrap.initialize();

    app.innerHTML = `

        <h1>

        SystemBootstrap Test

        </h1>

        <p style="color:green">

        ✅ SystemBootstrap

        Loaded Successfully

        </p>

        <p>

        Type:

        ${typeof SystemBootstrap}

        </p>

        <p>

        initialize:

        ${typeof SystemBootstrap.initialize}

        </p>

        <h3>

        Result

        </h3>

        <pre>${JSON.stringify(

            result,

            null,

            2

        )}</pre>

    `;

}

catch(error) {

    app.innerHTML = `

        <h1>

        SystemBootstrap Import Error

        </h1>

        <pre style="

            white-space:pre-wrap;

            word-break:break-word;

            color:red;

        ">${error.stack ||

           error.message ||

           String(error)}</pre>

    `;

}

</script>

</body>

</html>
