<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width, initial-scale=1.0">

<title>

Family Wealth AI OS V7

</title>

</head>

<body>

<div id="app">

Loading AssetsModule Test...

</div>

<script type="module">

const app =

document.getElementById("app");

app.innerHTML = `

<h1>

Family Wealth AI OS V7

</h1>

<h2>

AssetsModule Test

</h2>

<p>

Testing AssetsModule...

</p>

`;

try {

    const module =

        await import(

            "./core/modules/assetsModule.js"

        );

    const AssetsModule =

        module.default;

    app.innerHTML = `

        <h1>

        AssetsModule Test

        </h1>

        <p style="color:green">

        ✅ AssetsModule

        Loaded Successfully

        </p>

        <p>

        Type:

        ${typeof AssetsModule}

        </p>

        <p>

        Name:

        ${AssetsModule.name}

        </p>

        <p>

        Version:

        ${AssetsModule.version}

        </p>

        <p>

        Agent:

        ${typeof AssetsModule.agent}

        </p>

        <p>

        AI:

        ${typeof AssetsModule.ai}

        </p>

        <p>

        API:

        ${typeof AssetsModule.api}

        </p>

        <p>

        Analysis:

        ${typeof AssetsModule.analysis}

        </p>

        <p>

        Repository:

        ${typeof AssetsModule.repository}

        </p>

        <p>

        Schema:

        ${typeof AssetsModule.schema}

        </p>

        <p>

        Service:

        ${typeof AssetsModule.service}

        </p>

        <p>

        Events:

        ${typeof AssetsModule.events}

        </p>

        <p>

        View:

        ${typeof AssetsModule.view}

        </p>

    `;

}

catch(error) {

    app.innerHTML = `

        <h1>

        AssetsModule Import Error

        </h1>

        <pre style="

            white-space:pre-wrap;

            word-break:break-word;

            color:red;

        ">${error.stack ||

           error.message ||

           String(error)}</pre>

    `;

}

</script>

</body>

</html>
