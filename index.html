<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width, initial-scale=1.0">

<title>

Family Wealth AI OS V7

</title>

</head>

<body>

<div id="app">

Loading SystemManager Test...

</div>

<script type="module">

const app =

document.getElementById("app");

app.innerHTML = `

<h1>

Family Wealth AI OS V7

</h1>

<h2>

SystemManager Test

</h2>

<p>

Testing SystemManager...

</p>

`;

try {

    const module =

        await import(

            "./core/system/systemManager.js"

        );

    const SystemManager =

        module.default;

    const status =

        SystemManager.status();

    app.innerHTML = `

        <h1>

        SystemManager Test

        </h1>

        <p style="color:green">

        ✅ SystemManager

        Loaded Successfully

        </p>

        <p>

        Type:

        ${typeof SystemManager}

        </p>

        <p>

        start:

        ${typeof SystemManager.start}

        </p>

        <p>

        status:

        ${typeof SystemManager.status}

        </p>

        <p>

        getModules:

        ${typeof SystemManager.getModules}

        </p>

        <p>

        getAgents:

        ${typeof SystemManager.getAgents}

        </p>

        <h3>

        Status

        </h3>

        <pre>${JSON.stringify(

            status,

            null,

            2

        )}</pre>

    `;

}

catch(error) {

    app.innerHTML = `

        <h1>

        SystemManager Import Error

        </h1>

        <pre style="

            white-space:pre-wrap;

            word-break:break-word;

            color:red;

        ">${error.stack ||

           error.message ||

           String(error)}</pre>

    `;

}

</script>

</body>

</html>
