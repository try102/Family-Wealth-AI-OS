<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta

    name="viewport"

    content="width=device-width, initial-scale=1.0"

>

<title>

Family Wealth AI OS V7 - Overall Diagnostic

</title>

</head>

<body>

<div id="app">

Loading Family Wealth AI OS V7...

</div>

<script type="module">

const app =

    document.getElementById("app");

function show(

    title,

    message,

    color = "black"

){

    app.innerHTML = `

        <h1>

            Family Wealth AI OS V7

        </h1>

        <h2>

            ${title}

        </h2>

        <pre style="

            white-space:pre-wrap;

            word-break:break-word;

            color:${color};

        ">${message}</pre>

    `;

}

async function loadStep(

    step,

    path

){

    show(

        "Overall Diagnostic",

        `Step ${step}

Importing:

${path}

Please wait...`

    );

    try {

        const module =

            await import(

                path

            );

        return module;

    }

    catch(error){

        show(

            `❌ FAILED AT STEP ${step}`,

            `Import failed.

Path:

${path}

Error:

${error.stack ||

  error.message ||

  String(error)}`,

            "red"

        );

        throw error;

    }

}

try {

    // ==========================================

    // STEP 1

    // SystemManager

    // ==========================================

    const systemModule =

        await loadStep(

            1,

            "./core/system/systemManager.js?v=overall03"

        );

    const SystemManager =

        systemModule.default;

    if(!SystemManager){

        throw new Error(

            "SystemManager default export not found"

        );

    }

    const startResult =

        SystemManager.start();

    const status =

        SystemManager.status();

    // ==========================================

    // STEP 2

    // AssetAPI

    // ==========================================

    const assetModule =

        await loadStep(

            2,

            "./modules/asset/api/assetAPI.js?v=overall03"

        );

    const AssetAPI =

        assetModule.default;

    if(!AssetAPI){

        throw new Error(

            "AssetAPI default export not found"

        );

    }

    const assets =

        AssetAPI.getAll();

    const assetTotal =

        AssetAPI.getTotalValue();

    // ==========================================

    // STEP 3

    // WealthEngine

    // ==========================================

    const wealthModule =

        await loadStep(

            3,

            "./core/engines/wealth/wealthEngine.js?v=overall03"

        );

    const WealthEngine =

        wealthModule.default;

    if(!WealthEngine){

        throw new Error(

            "WealthEngine default export not found"

        );

    }

    const wealthResult =

        WealthEngine.analyze(

            assets,

            [],

            {

                income: 0,

                expense: 0,

                net: 0,

                netCashFlow: 0

            },

            0

        );

    // ==========================================

    // STEP 4

    // AssetView

    // ==========================================

    const assetViewModule =

        await loadStep(

            4,

            "./modules/asset/ui/assetView.js?v=overall03"

        );

    const AssetView =

        assetViewModule.default;

    if(!AssetView){

        throw new Error(

            "AssetView default export not found"

        );

    }

    // ==========================================

    // OVERALL SUCCESS

    // ==========================================

    app.innerHTML = `

        <h1>

            Family Wealth AI OS V7

        </h1>

        <h2>

            Overall Diagnostic

        </h2>

        <p style="

            color:green;

            font-size:22px;

            font-weight:bold;

        ">

            🎉 V7 CORE OVERALL TEST PASSED

        </p>

        <h3>

            Step Results

        </h3>

        <p>

            SystemManager:

            ✅ PASS

        </p>

        <p>

            AssetAPI:

            ✅ PASS

        </p>

        <p>

            WealthEngine:

            ✅ PASS

        </p>

        <p>

            AssetView:

            ✅ PASS

        </p>

        <h3>

            Start Result

        </h3>

        <pre>${JSON.stringify(

            startResult,

            null,

            2

        )}</pre>

        <h3>

            System Status

        </h3>

        <pre>${JSON.stringify(

            status,

            null,

            2

        )}</pre>

        <h3>

            Assets

        </h3>

        <pre>${JSON.stringify(

            assets,

            null,

            2

        )}</pre>

        <h3>

            Asset Total

        </h3>

        <pre>

${assetTotal}

        </pre>

        <h3>

            WealthEngine Result

        </h3>

        <pre>${JSON.stringify(

            wealthResult,

            null,

            2

        )}</pre>

        <h3>

            AssetView

        </h3>

        <pre>

AssetView:

✅ LOADED

        </pre>

    `;

}

catch(error){

    console.error(

        "V7 Overall Diagnostic Error:",

        error

    );

}

</script>

</body>

</html>
